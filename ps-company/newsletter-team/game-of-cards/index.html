<style>

  html, body { margin: 0; min-height: 100%; }
  body { background: var(--notte) radial-gradient(ellipse at top, #2c2116 0%, var(--notte) 60%) fixed; color: var(--pergamena); font-family: "IM Fell English", Georgia, serif; display: grid; place-items: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
  form { width: 100%; max-width: 380px; text-align: center; }
  h1 { font-family: "Cinzel Decorative", serif; font-weight: 900; font-size: clamp(34px, 9vw, 52px); margin: 0 0 8px; background: linear-gradient(180deg, var(--oro-chiaro), var(--oro) 55%, #8a6a28); -webkit-background-clip: text; background-clip: text; color: transparent; }

  input[type=password] { width: 100%; box-sizing: border-box; padding: 14px 16px; font-size: 18px; font-family: inherit; border-radius: 3px; border: 1px solid var(--oro); background: var(--pergamena); color: var(--inchiostro); }
  input[type=password]:focus { outline: 2px solid var(--oro-chiaro); outline-offset: 2px; }
  button { margin-top: 14px; width: 100%; padding: 13px; font-family: "Cinzel Decorative", serif; font-weight: 700; font-size: 17px; letter-spacing: .05em; border: 0; border-radius: 3px; background: var(--oro); color: var(--notte); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  label.ricorda { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 14px; font-size: 16px; color: #bba887; }
  .errore { min-height: 24px; margin-top: 12px; color: #e8a0a0; font-size: 16px; }
</style>

const CHIAVE_LOCALE = "game-of-cards-parola";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function apri(parola) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(parola), "PBKDF2", false, ["deriveKey"]);
  const chiave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(DATI.sale), iterations: DATI.iterazioni, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const chiaro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATI.iv) }, chiave, b64(DATI.testo));
  return new TextDecoder().decode(chiaro);
}

function mostra(html) { document.open(); document.write(html); document.close(); }

async function prova(parola, salva) {
  const html = await apri(parola);
  if (salva) { try { localStorage.setItem(CHIAVE_LOCALE, parola); } catch (e) {} }
  mostra(html);
}

document.getElementById("porta").addEventListener("submit", async e => {
  e.preventDefault();
  const bottone = document.getElementById("entra"), errore = document.getElementById("errore");
  bottone.disabled = true; errore.textContent = "";
  try {
    await prova(document.getElementById("parola").value, document.getElementById("ricorda").checked);
  } catch (err) {
    errore.textContent = "Parola d'ordine sbagliata. Riprova.";
    bottone.disabled = false;
  }
});

(async () => {
  let salvata = null;
  try { salvata = localStorage.getItem(CHIAVE_LOCALE); } catch (e) {}
  if (salvata) {
    try { await prova(salvata, false); }
    catch (e) { try { localStorage.removeItem(CHIAVE_LOCALE); } catch (e2) {} }
  }
})();
</script>
