<!doctype html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>La Newsletteronza</title>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --dark: #0F0F1A; --dark2: #1A1A2E; --purple: #7B52F5; --teal: #00D4B8; --text: #FFFFFF; --muted: #A9A9C2; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--dark);
    background-image: radial-gradient(circle at 15% 20%, rgba(123,82,245,.35), transparent 45%), radial-gradient(circle at 85% 85%, rgba(0,212,184,.25), transparent 45%);
    color: var(--text); font-family: "DM Sans", Arial, sans-serif;
    display: grid; place-items: center; padding: 24px; box-sizing: border-box;
  }
  .scheda { max-width: 560px; text-align: center; }
  .barra { width: 64px; height: 4px; border-radius: 2px; margin: 0 auto 28px; background: linear-gradient(90deg, var(--purple), var(--teal)); }
  .etichetta { font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); margin-bottom: 14px; }
  h1 { font-family: Outfit, Arial, sans-serif; font-weight: 800; font-size: clamp(28px, 6vw, 42px); line-height: 1.15; margin: 0 0 18px; text-wrap: balance; }
  p { font-size: 18px; line-height: 1.6; color: var(--muted); margin: 0; }
  .cuore { color: var(--purple); }
</style>
<div class="scheda">
  <div class="barra"></div>
  <div class="etichetta">La Newsletteronza</div>
  <h1>Hai scelto di riceverla per tutta la vita.</h1>
  <p>Grazie, quando inizia a fare freddo, gesti come questo mi scaldano il <span class="cuore">cuore</span>.</p>
</div>
</html>
